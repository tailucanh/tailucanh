name: Generate Datas

on:
  schedule: # every 12 hours (minute 0)
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-datas
  cancel-in-progress: true

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Stats + top languages cards, built from the GitHub API with GITHUB_TOKEN.
      # Runs before snk: snk is a Docker action and creates dist/ as root, which the runner user cannot write to.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build stats cards
        run: node .github/scripts/stats.mjs tailucanh dist
        continue-on-error: true # a stats failure must not block the snake update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contribution snake (light + dark)
      - uses: Platane/snk@v3
        with:
          github_user_name: tailucanh
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3b0764,#6b21a8,#a855f7,#e9d5ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
